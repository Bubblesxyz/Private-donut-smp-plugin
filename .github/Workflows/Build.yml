name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip plugin project
        run: unzip -o DrDonutMenu.zip

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        run: mvn -B clean package --file DrDonutMenu/pom.xml

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: DrDonutMenu-jar
          path: DrDonutMenu/target/DrDonutMenu.jar
