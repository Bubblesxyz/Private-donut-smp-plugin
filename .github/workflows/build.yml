name: Build plugin
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q DrDonutMenu-source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mvn -B -f DrDonutMenu2/pom.xml package
      - uses: actions/upload-artifact@v4
        with:
          name: DrDonutMenu
          path: DrDonutMenu2/target/DrDonutMenu.jar
